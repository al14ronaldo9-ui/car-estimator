<style>
* { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #121212;
      color: #fff;

    }
    .card {
      width: min(460px, 100%);
      background: #202020;

      padding: 22px;

    h1 { margin: 0 0 8px; font-size: 22px; }
    .hint { margin: 0 0 18px; color: #bdbdbd; font-size: 13px; }
    label { display: block; margin: 13px 0 6px; font-size: 14px; }
    input, textarea {
      width: 100%;
      border: 1px solid #555;
      border-radius: 9px;
      background: #2b2b2b;

      font: inherit;

    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #status {
      min-height: 22px;

<body>
  <main class="card">
    <h1>ثبت‌نام</h1>
    <p class="hint">اطلاعات شما برای تکمیل حساب کاربری ذخیره می‌شود.</p>

    <form id="signup-form">
      <label for="full-name">نام و نام خانوادگی</label>
      <input id="full-name" type="text" required autocomplete="name" placeholder="مثلاً علی رضایی">

      <label for="phone">شماره تلفن</label>
      <input id="phone" type="tel" required autocomplete="tel" placeholder="مثلاً 09123456789">

      <label for="address">آدرس</label>
      <textarea id="address" required autocomplete="street-address" placeholder="استان، شهر، آدرس کامل"></textarea>

      <label for="email">ایمیل</label>
      <input id="email" type="email" required autocomplete="email" placeholder="example@email.com">

      <label for="password">رمز عبور</label>
      <input id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="حداقل ۶ کاراکتر">

      <button id="signup-btn" type="submit">ساخت حساب</button>
      <div id="status"></div>
    </form>

    
    <hr style="border:0;border-top:1px solid rgba(148,163,184,.14);margin:24px 0">

    <section id="profile-section">
      <h2 style="margin:0 0 8px;font-size:19px">👤 پروفایل عمومی</h2>
      <p class="hint">این اطلاعات در گفتگوی عمومی برای سایر کاربران نمایش داده می‌شود.</p>

      <label for="username">نام کاربری</label>
      <input id="username" type="text" maxlength="30"
             placeholder="مثلاً Ali_R">
      
      <label for="bio">بیوگرافی</label>
      <textarea id="bio" maxlength="160"
                placeholder="کمی درباره خودت بنویس..."></textarea>

      <label>عکس پروفایل</label>

      <div id="avatar-preview-wrap" style="display:flex;align-items:center;gap:12px;margin:10px 0 14px">
        <img id="avatar-preview"
             src=""
             alt="عکس پروفایل"
             style="width:64px;height:64px;border-radius:50%;object-fit:cover;display:none;border:2px solid rgba(56,189,248,.35)">
        <span id="avatar-preview-text" style="font-size:11px;color:#8490a3">
          هنوز عکسی انتخاب نشده
        </span>
      </div>

      <input id="avatar-file"
             type="file"
             accept="image/jpeg,image/png,image/webp"
             style="width:100%;margin-bottom:12px">

      <input id="avatar-url"
             type="hidden"
             value="">

      <button id="save-profile" type="button">ذخیره پروفایل</button>
      <div id="profile-status"></div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://zpobmwhvhqjcqmaoqtxq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ruoLdqEOaFEuQjPt5e0Huw_KwKAOp4T';

    const form = document.getElementById('signup-form');
    const button = document.getElementById('signup-btn');
    const statusBox = document.getElementById('status');

    function setStatus(text, success) {
      statusBox.textContent = text;
      statusBox.className = success ? 'success' : '';
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const fullName = document.getElementById('full-name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      button.disabled = true;
      setStatus('در حال ساخت حساب…');

      try {
        const response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: password,
            data: {
              full_name: fullName,
              phone: phone,
              address: address
            }
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.msg || result.message || 'ثبت‌نام ناموفق بود.');
        }

        form.reset();

        if (result.user && result.user.identities && result.user.identities.length === 0) {
          setStatus('این ایمیل قبلاً ثبت شده است. وارد حساب شوید.', false);
        } else {
          setStatus('ثبت‌نام با موفقیت انجام شد؛ در حال ورود به سایت…', true);
          setTimeout(() => { window.location.href = 'index.html'; }, 900);
        }
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'خطا در ثبت‌نام. دوباره تلاش کنید.', false);
      } finally {
        button.disabled = false;
      }
    });
  </script>
  

<script id="profile-manager">
(function () {
  const SUPABASE_URL = 'https://zpobmwhvhqjcqmaoqtxq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ruoLdqEOaFEuQjPt5e0Huw_KwKAOp4T';

  const raw = localStorage.getItem('supabase_session');
  if (!raw) return;

  let session;
  try {
    session = JSON.parse(raw);
  } catch {
    return;
  }

  if (!session.user || !session.access_token) return;

  const userId = session.user.id;

  const username = document.getElementById('username');
  const bio = document.getElementById('bio');
  const avatarUrl = document.getElementById('avatar-url');
  const avatarFile = document.getElementById('avatar-file');
  const avatarPreview = document.getElementById('avatar-preview');
  const avatarPreviewText = document.getElementById('avatar-preview-text');
  const saveButton = document.getElementById('save-profile');
  const status = document.getElementById('profile-status');

  if (!username || !bio || !avatarUrl || !avatarFile || !saveButton) return;

  const authHeaders = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + session.access_token
  };

  function showStatus(text, ok) {
    if (!status) return;
    status.textContent = text;
    status.style.color = ok ? '#70e0a0' : '#ffb4a6';
  }

  function showAvatar(url) {
    if (!avatarPreview || !avatarPreviewText) return;

    if (url) {
      avatarPreview.src = url;
      avatarPreview.style.display = 'block';
      avatarPreviewText.textContent = 'عکس پروفایل انتخاب شده';
    } else {
      avatarPreview.src = '';
      avatarPreview.style.display = 'none';
      avatarPreviewText.textContent = 'هنوز عکسی انتخاب نشده';
    }
  }

  async function loadProfile() {
    try {
      const response = await fetch(
        SUPABASE_URL +
        '/rest/v1/profiles?id=eq.' +
        encodeURIComponent(userId) +
        '&select=username,bio,avatar_url',
        { headers: authHeaders }
      );

      if (!response.ok) {
        throw new Error('خطا در دریافت پروفایل');
      }

      const data = await response.json();

      if (data.length) {
        username.value = data[0].username || '';
        bio.value = data[0].bio || '';
        avatarUrl.value = data[0].avatar_url || '';
        showAvatar(data[0].avatar_url || '');
      }
    } catch (error) {
      console.error(error);
      showStatus('دریافت پروفایل ناموفق بود.', false);
    }
  }

  avatarFile.addEventListener('change', function () {
    const file = avatarFile.files && avatarFile.files[0];
    if (!file) return;

    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      showStatus('فقط JPG، PNG یا WebP مجاز است.', false);
      avatarFile.value = '';
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      showStatus('حجم عکس باید کمتر از ۵ مگابایت باشد.', false);
      avatarFile.value = '';
      return;
    }

    const previewUrl = URL.createObjectURL(file);
    showAvatar(previewUrl);
    showStatus('عکس انتخاب شد؛ برای آپلود روی ذخیره پروفایل بزن.', true);
  });

  async function uploadAvatar(file) {
    const extension =
      file.type === 'image/png' ? 'png' :
      file.type === 'image/webp' ? 'webp' : 'jpg';

    const filePath = userId + '/avatar.' + extension;

    const response = await fetch(
      SUPABASE_URL +
      '/storage/v1/object/avatars/' +
      encodeURIComponent(filePath),
      {
        method: 'POST',
        headers: {
          ...authHeaders,
          'Content-Type': file.type,
          'x-upsert': 'true'
        },
        body: file
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error('AVATAR UPLOAD ERROR:', response.status, errorText);
      showStatus('خطای آپلود: ' + errorText, false);
      throw new Error('آپلود عکس ناموفق بود.');
    }

    return SUPABASE_URL +
      '/storage/v1/object/public/avatars/' +
      filePath +
      '?v=' + Date.now();
  }

  async function saveProfile() {
    const name = username.value.trim();
    const biography = bio.value.trim();

    if (!name) {
      showStatus('نام کاربری را وارد کن.', false);
      return;
    }

    if (!/^[a-zA-Z0-9_آ-ی]{3,30}$/.test(name)) {
      showStatus('نام کاربری باید ۳ تا ۳۰ کاراکتر و بدون فاصله باشد.', false);
      return;
    }

    saveButton.disabled = true;

    try {
      let avatar = avatarUrl.value.trim();

      const file =
        avatarFile.files && avatarFile.files[0];

      if (file) {
        showStatus('در حال آپلود عکس...', true);
        avatar = await uploadAvatar(file);
        avatarUrl.value = avatar;
      }

      showStatus('در حال ذخیره پروفایل...', true);

      const response = await fetch(
        SUPABASE_URL + '/rest/v1/profiles?on_conflict=id',
        {
          method: 'POST',
          headers: {
            ...authHeaders,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates,return=representation'
          },
          body: JSON.stringify({
            id: userId,
            username: name,
            bio: biography,
            avatar_url: avatar,
            updated_at: new Date().toISOString()
          })
        }
      );

      const result = await response.json().catch(() => []);

      if (!response.ok) {
        console.error(result);
        throw new Error(
          result.message ||
          result.msg ||
          'ذخیره پروفایل ناموفق بود.'
        );
      }

      showAvatar(avatar);
      showStatus('پروفایل و عکس با موفقیت ذخیره شد ✓', true);

    } catch (error) {
      console.error(error);
      showStatus(
        error.message || 'خطا در ذخیره پروفایل.',
        false
      );
    } finally {
      saveButton.disabled = false;
    }
  }

  saveButton.addEventListener('click', saveProfile);

  loadProfile();
})();
</script>




<script id="account-auth-ui-script">
(function () {
  function initAccountAuthUI() {
    try {
      const raw = localStorage.getItem('supabase_session');
      if (!raw) return;

      const session = JSON.parse(raw);

      if (!session || !session.user || !session.access_token) return;

      const form = document.getElementById('signup-form');
      const title = document.querySelector('h1');
      const profileSection = document.getElementById('profile-section');

      if (form) {
        form.style.display = 'none';
      }

      if (title && title.textContent.includes('ثبت‌نام')) {
        title.textContent = 'حساب کاربری';
      }

      if (!profileSection) {
        console.warn('profile-section هنوز آماده نیست');
        return;
      }

      let box = document.getElementById('account-auth-box');

      if (!box) {
        box = document.createElement('div');
        box.id = 'account-auth-box';

        const email = session.user.email || 'کاربر';

        box.innerHTML = `
          <div style="font-weight:800;font-size:17px">حساب شما</div>
          <div class="auth-email">${email}</div>
          <button id="account-logout" type="button">خروج از حساب</button>
        `;

        profileSection.parentNode.insertBefore(box, profileSection);
      }

      const logout = document.getElementById('account-logout');

      if (logout && !logout.dataset.bound) {
        logout.dataset.bound = '1';

        logout.addEventListener('click', function () {
          localStorage.removeItem('supabase_session');
          window.location.href = 'login.html';
        });
      }

    } catch (e) {
      console.error('ACCOUNT AUTH UI ERROR:', e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAccountAuthUI);
  } else {
    initAccountAuthUI();
  }
})();
</script>

<script id="supabase-session">
(() => {
  const raw = localStorage.getItem('supabase_session');

  if (!raw) {
    window.location.href = 'login.html';
    return;
  }

  try {
    const session = JSON.parse(raw);

    if (!session.access_token || !session.user) {
      localStorage.removeItem('supabase_session');
      window.location.href = 'login.html';
      return;
    }

    console.log('Logged in user:', session.user.email);
  } catch (e) {
    localStorage.removeItem('supabase_session');
    window.location.href = 'login.html';
  }
})();
</script>
