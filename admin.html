<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت پیام‌ها</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background: #121212; color: #fff;
    }
    .container { width: min(760px, 100%); margin: auto; }
    .card {
      background: #202020; border: 1px solid #3a3a3a;
      border-radius: 14px; padding: 18px; margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 18px; }
    input {
      width: 100%; height: 44px; margin: 7px 0; padding: 0 12px;
      border: 1px solid #555; border-radius: 8px;
      background: #2d2d2d; color: #fff; font-size: 14px;
    }
    button {
      min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px;
      background: #ff4b2b; color: #fff; cursor: pointer; font-size: 14px;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .hidden { display: none !important; }
    .status { min-height: 22px; margin-top: 10px; color: #ffb4a6; font-size: 13px; }
    .message {
      padding: 13px; margin-top: 10px; border-radius: 10px;
      background: #2a2a2a; border-right: 4px solid #555;
    }
    .message.user { border-right-color: #1683ff; }
    .message.expert { border-right-color: #24ad67; }
    .message-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 8px; font-size: 12px; color: #c6c6c6;
    }
    .message-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
    .delete-btn { background: #c62828; min-height: 34px; font-size: 12px; }
    .empty { color: #bbb; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <main class="container">
    <section id="login-card" class="card">
      <h1>ورود مدیر</h1>
      <input id="email" type="email" autocomplete="email" placeholder="ایمیل ادمین">
      <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور">
      <button id="login-btn" type="button">ورود به پنل</button>
      <div id="login-status" class="status"></div>
    </section>

    <section id="admin-card" class="hidden">
      <div class="card topbar">
        <div>
          <h1 style="margin-bottom:6px">مدیریت پیام‌های Global Chat</h1>
          <small id="admin-email"></small>
        </div>
        <div>
          <button id="refresh-btn" type="button">بروزرسانی</button>
          <button id="logout-btn" type="button">خروج</button>
        </div>
      </div>
      <div class="card">
        <div id="messages"></div>
        <div id="messages-status" class="status"></div>
      </div>
    </section>
  </main>

  <script>
  (function () {
    const SUPABASE_URL = 'https://zpobmwhvhqjcqmaoqtxq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ruoLdqEOaFEuQjPt5e0Huw_KwKAOp4T';
    const ADMIN_ID = '69ef5bd0-af27-4e40-8c08-d180b11f0d56';
    const MESSAGES_URL = SUPABASE_URL + '/rest/v1/messages';
    const AUTH_URL = SUPABASE_URL + '/auth/v1';

    const loginCard = document.getElementById('login-card');
    const adminCard = document.getElementById('admin-card');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const loginButton = document.getElementById('login-btn');
    const loginStatus = document.getElementById('login-status');
    const messagesBox = document.getElementById('messages');
    const messagesStatus = document.getElementById('messages-status');
    const adminEmail = document.getElementById('admin-email');

    let accessToken = sessionStorage.getItem('admin_access_token') || '';
    let currentUser = null;

    function setLoginStatus(text) { loginStatus.textContent = text || ''; }
    function setMessagesStatus(text) { messagesStatus.textContent = text || ''; }

    function clearSession() {
      sessionStorage.removeItem('admin_access_token');
      sessionStorage.removeItem('admin_user');
      accessToken = '';
      currentUser = null;
      adminCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
      password.value = '';
    }

    async function apiHeaders() {
      return {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + accessToken
      };
    }

    async function verifyAdmin() {
      if (!accessToken) return false;

      const response = await fetch(AUTH_URL + '/user', {
        headers: await apiHeaders()
      });

      if (!response.ok) return false;
      currentUser = await response.json();

      if (currentUser.id !== ADMIN_ID) {
        clearSession();
        setLoginStatus('این حساب اجازهٔ ورود به پنل مدیریت را ندارد.');
        return false;
      }

      sessionStorage.setItem('admin_user', JSON.stringify(currentUser));
      adminEmail.textContent = currentUser.email || 'ادمین';
      loginCard.classList.add('hidden');
      adminCard.classList.remove('hidden');
      return true;
    }

    function createMessage(item) {
      const box = document.createElement('article');
      box.className = 'message ' + (item.sender === 'expert' ? 'expert' : 'user');

      const head = document.createElement('div');
      head.className = 'message-head';

      const info = document.createElement('span');
      const date = item.created_at ? new Date(item.created_at).toLocaleString('fa-IR') : '';
      info.textContent = (item.sender === 'expert' ? 'کارشناس' : 'کاربر') + (date ? ' — ' + date : '');

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.type = 'button';
      del.textContent = 'حذف پیام';
      del.onclick = function () { deleteMessage(item.id, del); };

      const text = document.createElement('div');
      text.className = 'message-text';
      text.textContent = item.text || '';

      head.append(info, del);
      box.append(head, text);
      return box;
    }

    async function loadMessages() {
      setMessagesStatus('در حال دریافت پیام‌ها…');
      messagesBox.innerHTML = '';

      try {
        const response = await fetch(
          MESSAGES_URL + '?select=id,text,sender,created_at&order=created_at.desc',
          { headers: await apiHeaders() }
        );
        if (!response.ok) throw new Error('دریافت پیام‌ها ناموفق بود.');

        const data = await response.json();
        if (!data.length) {
          messagesBox.innerHTML = '<div class="empty">هنوز پیامی وجود ندارد.</div>';
        } else {
          data.forEach(function (item) {
            messagesBox.appendChild(createMessage(item));
          });
        }
        setMessagesStatus('');
      } catch (error) {
        setMessagesStatus('خطا در دریافت پیام‌ها. دوباره تلاش کنید.');
        console.error(error);
      }
    }

    async function deleteMessage(id, button) {
      if (!confirm('این پیام برای همیشه حذف شود؟')) return;

      button.disabled = true;
      try {
        const response = await fetch(MESSAGES_URL + '?id=eq.' + encodeURIComponent(id), {
          method: 'DELETE',
          headers: await apiHeaders()
        });
        if (!response.ok) throw new Error('حذف پیام ناموفق بود.');
        await loadMessages();
      } catch (error) {
        alert('حذف پیام ناموفق بود.');
        button.disabled = false;
        console.error(error);
      }
    }

    loginButton.onclick = async function () {
      const userEmail = email.value.trim();
      const userPassword = password.value;
      if (!userEmail || !userPassword) {
        setLoginStatus('ایمیل و رمز عبور را وارد کنید.');
        return;
      }

      loginButton.disabled = true;
      setLoginStatus('در حال ورود…');

      try {
        const response = await fetch(AUTH_URL + '/token?grant_type=password', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: userEmail, password: userPassword })
        });

        if (!response.ok) throw new Error('اطلاعات ورود نادرست است.');
        const session = await response.json();
        accessToken = session.access_token;
        sessionStorage.setItem('admin_access_token', accessToken);

        if (await verifyAdmin()) {
          setLoginStatus('');
          await loadMessages();
        }
      } catch (error) {
        setLoginStatus('ورود ناموفق بود. ایمیل و رمز عبور را بررسی کنید.');
        console.error(error);
      } finally {
        loginButton.disabled = false;
      }
    };

    document.getElementById('refresh-btn').onclick = loadMessages;
    document.getElementById('logout-btn').onclick = clearSession;

    verifyAdmin().then(function (isAdmin) {
      if (isAdmin) loadMessages();
    });
  })();
  </script>
</body>
</html>
