<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>برآورد خسارت خودرو — هوش مصنوعی</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
:root {
  --bg-gradient: linear-gradient(135deg, #090d16 0%, #05070c 100%);
  --panel-bg: rgba(17, 24, 39, 0.7);
  --border-glow: rgba(6, 182, 212, 0.15);
  --primary: #06b6d4;
  --secondary: #3b82f6;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --success: #10b981;
  --danger: #f43f5e;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Vazirmatn, Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 16px; display: flex; justify-content: center; align-items: flex-start; }
main { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
header { text-align: center; margin-bottom: 8px; }
header h1 { font-size: 1.5rem; font-weight: 900; background: linear-gradient(120deg, #38bdf8, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
header .sub { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
.card { background: var(--panel-bg); border: 1px solid var(--border-glow); border-radius: 20px; padding: 20px; backdrop-filter: blur(16px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); }
.picker { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed rgba(6, 182, 212, 0.25); border-radius: 16px; padding: 32px 20px; text-align: center; cursor: pointer; background: rgba(15, 23, 42, 0.3); }
.picker input { display: none; }
.preview-wrapper { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #020617; margin-top: 16px; display: none; }
#preview { width: 100%; height: auto; display: block; border-radius: 14px; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#analyzeButton { width: 100%; padding: 15px; margin-top: 16px; border: 0; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 1rem; font-weight: 800; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35); }
#analyzeButton:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
#status { margin-top: 14px; font-size: 0.85rem; padding: 10px 14px; border-radius: 10px; background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.02); }
#status.ok { color: var(--success); background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.2); }
#status.error { color: var(--danger); background: rgba(244, 63, 94, 0.08); border-color: rgba(244, 63, 94, 0.2); }
.table-responsive { overflow-x: auto; margin-top: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.06); background: rgba(15, 23, 42, 0.2); }
table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.85rem; }
th, td { padding: 10px 12px; }
th { background: rgba(15, 23, 42, 0.6); color: #38bdf8; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
td { color: #e2e8f0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
.total-row td { background: rgba(6, 182, 212, 0.08); color: #22d3ee; font-weight: bold; }
</style>
</head>
<body>
<main>
  <header>
    <h1>برآورد خسارت خودرو</h1>
    <div class="sub">هوش مصنوعی تشخیص آسیب</div>
  </header>
  <div class="card">
    <label class="picker" id="dropZone">
      <div style="font-size: 2.5rem; margin-bottom: 8px;">📷</div>
      <div style="font-weight: 700; color: #e2e8f0; margin-bottom: 4px;">انتخاب تصویر خودرو</div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">تصویر باکیفیت و با نور کافی آپلود کنید</div>
      <input type="file" id="imageInput" accept="image/*">
    </label>
    <div class="preview-wrapper" id="previewWrapper">
      <img id="preview" alt="پیش‌نمایش">
      <canvas id="overlay"></canvas>
    </div>
    <button id="analyzeButton" disabled>تحلیل و برآورد خسارت</button>
    <div id="status">در حال بارگذاری کتابخانه هوش مصنوعی...</div>
  </div>
  <div class="card" id="resultCard">
    <h2 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 10px;">📋 جزئیات خسارت برآورد شده</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>نوع آسیب</th>
            <th>تعداد</th>
            <th>بازه هزینه (تومان)</th>
          </tr>
        </thead>
        <tbody id="resultTableBody">
          <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">هنوز تصویری تحلیل نشده است</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script>
(async function () {
  'use strict';
  let session = null;
  const statusEl = document.getElementById('status');
  const imageInput = document.getElementById('imageInput');
  const preview = document.getElementById('preview');
  const previewWrapper = document.getElementById('previewWrapper');
  const analyzeButton = document.getElementById('analyzeButton');

  function setStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  if (typeof ort === 'undefined') {
    setStatus('کتابخانه ONNX Runtime بارگذاری نشد.', 'error');
    return;
  }

  try {
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/';
    setStatus('در حال بارگذاری مدل هوش مصنوعی...');
    session = await ort.InferenceSession.create('./static/best.onnx', { executionProviders: ['wasm'] });
    setStatus('مدل آماده است. تصویر را انتخاب کنید.', 'ok');
    analyzeButton.disabled = false;
  } catch (e) {
    setStatus('خطا در لود مدل: ' + e.message, 'error');
  }

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      preview.src = event.target.result;
      preview.style.display = 'block';
      previewWrapper.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });
})();
</script>
</body>
</html>
