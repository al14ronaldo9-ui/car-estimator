<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0f19;
  color:#f0f6fc;
  font-family:Arial,sans-serif;
}
.card{
  width:min(90%,400px);
  padding:25px;
  background:#161b22;
  border:1px solid #30363d;
  border-radius:18px;
  box-sizing:border-box;
}
h2{text-align:center}
label{display:block;margin:15px 0 6px}
input{
  width:100%;
  height:44px;
  box-sizing:border-box;
  padding:0 12px;
  background:#0b0f19;
  color:#fff;
  border:1px solid #30363d;
  border-radius:9px;
}
button{
  width:100%;
  height:46px;
  margin-top:20px;
  border:0;
  border-radius:9px;
  background:#20d3ee;
  color:#061018;
  font-weight:bold;
  font-size:15px;
}
button:disabled{opacity:.5}
#status{
  margin-top:15px;
  text-align:center;
  line-height:1.7;
}
a{color:#20d3ee}
</style>
</head>

<body>

<div class="card">
  <h2>ورود به حساب</h2>

  <form id="login-form">
    <label for="email">ایمیل</label>
    <input id="email" type="email" required autocomplete="email">

    <label for="password">رمز عبور</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button id="login-btn" type="submit">ورود</button>
  </form>

  <div id="status"></div>

  <p style="text-align:center">
    حساب ندارید؟
    <a href="signup.html">ثبت‌نام</a>
  </p>
</div>

<script>
const SUPABASE_URL = 'https://zpobmwhvhqjcqmaoqtxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ruoLdqEOaFEuQjPt5e0Huw_KwKAOp4T';

const form = document.getElementById('login-form');
const button = document.getElementById('login-btn');
const statusBox = document.getElementById('status');

function status(text, ok=false){
  statusBox.textContent = text;
  statusBox.style.color = ok ? '#3fb950' : '#ff7b72';
}

form.addEventListener('submit', async e => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  button.disabled = true;
  status('در حال ورود...');

  try {
    const response = await fetch(
      SUPABASE_URL + '/auth/v1/token?grant_type=password',
      {
        method:'POST',
        headers:{
          'apikey':SUPABASE_KEY,
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const result = await response.json();

    if(!response.ok){
      throw new Error(
        result.error_description ||
        result.msg ||
        result.message ||
        'ایمیل یا رمز عبور اشتباه است.'
      );
    }

    if(!result.access_token){
      throw new Error('ورود انجام شد ولی Session دریافت نشد.');
    }

    localStorage.setItem(
      'supabase_session',
      JSON.stringify(result)
    );

    status('ورود موفق بود؛ در حال انتقال...', true);

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 500);

  } catch(error) {
    console.error(error);
    status(error.message || 'خطا در ورود');
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
